services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: url-shortener-api
    environment:
      DATABASE_PATH: /data/urlshortener.db
      SERVER_PORT: 8080
    volumes:
      - urlshortener-data:/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/urls > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: url-shortener-frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  urlshortener-data:
